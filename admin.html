<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>人生反向設計所｜管理中心</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    :root{--green:#19372b;--gold:#d8b56d;--paper:#f5f2ec;--card:#fffdf9;--ink:#18221d;--muted:#748078;--line:#ded9d0}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,"Noto Sans TC",sans-serif}
    button,input{font:inherit}.hidden{display:none!important}.shell{min-height:100vh;display:grid;grid-template-columns:240px 1fr}
    aside{background:var(--green);color:white;padding:25px 18px;display:flex;flex-direction:column}.brand{display:flex;gap:12px;align-items:center;margin-bottom:35px}.mark{width:42px;height:42px;display:grid;place-items:center;background:var(--gold);color:var(--green);border-radius:13px;font:700 22px Georgia}.brand strong{display:block;font-family:Georgia}.brand small{color:#ffffff9c}
    nav button{width:100%;display:flex;gap:10px;align-items:center;border:0;border-radius:10px;background:transparent;color:#ffffffa8;padding:12px;text-align:left}nav button.active{background:#ffffff16;color:white}.account{margin-top:auto;border-top:1px solid #ffffff1a;padding-top:18px;font-size:12px;color:#ffffffa8}
    main{min-width:0}.top{height:82px;background:#fffdf9cc;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 42px}.top h1{margin:0;font:500 24px Georgia}.top small{color:var(--muted)}.signout{border:1px solid var(--line);border-radius:9px;background:white;padding:8px 12px;cursor:pointer}
    .content{max-width:1360px;margin:auto;padding:38px 42px}.intro h2{font:500 38px Georgia;margin:0 0 8px}.intro p{color:var(--muted);margin:0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:28px 0 16px}.metric,.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 25px #25362d0a}.metric{padding:20px}.metric span{font-size:12px;color:var(--muted)}.metric strong{display:block;margin-top:18px;font:500 34px Georgia}.panel{overflow:hidden}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px 22px;border-bottom:1px solid var(--line)}.panel-head h3{font:500 21px Georgia;margin:0}.panel-tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.search{border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:white}.export{border:1px solid var(--green);border-radius:9px;padding:9px 12px;background:white;color:var(--green);cursor:pointer;font-size:12px}.export.primary{background:var(--green);color:white}
    table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:14px 20px;border-bottom:1px solid #ebe7df}th{font-size:11px;color:var(--muted)}tbody tr{cursor:pointer}tbody tr:hover{background:#f7f4ee}.pill{display:inline-block;padding:5px 8px;border-radius:99px;font-size:10px;background:#e3eee6;color:#39704f}.pill.failed{background:#f7e4e1;color:#a43e33}.empty{text-align:center;color:var(--muted);padding:55px}
    .login{min-height:100vh;display:grid;place-items:center;background:var(--green);padding:24px}.login-card{width:min(420px,100%);background:var(--card);border-radius:24px;padding:40px;text-align:center}.login-card h1{font:500 30px Georgia;margin:18px 0 10px}.login-card p{color:var(--muted);line-height:1.6}.login-button{width:100%;border:0;border-radius:12px;background:var(--green);color:white;font-weight:700;padding:13px;cursor:pointer;margin-top:15px}.login-button:disabled{opacity:.55;cursor:wait}.error{color:#a43e33;font-size:12px;margin-top:14px}.success{color:#39704f;font-size:13px;line-height:1.6;margin-top:14px}
    dialog{width:min(880px,calc(100% - 30px));border:0;border-radius:20px;padding:0;box-shadow:0 30px 90px #0004}dialog::backdrop{background:#13251dbd}.detail-head{padding:22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start}.detail-head small{display:block;color:var(--muted);font-weight:400;margin-top:6px}.detail-body{padding:22px;max-height:76vh;overflow:auto}.close{border:0;background:transparent;font-size:22px}.detail-section{border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px;background:#fffdf9}.detail-section h3{font:500 18px Georgia;margin:0 0 12px;color:var(--green)}.detail-section h4{font-size:13px;margin:16px 0 5px;color:#567064}.detail-section p{font-size:14px;line-height:1.8;margin:7px 0;white-space:pre-wrap}.answer{padding:12px 0;border-bottom:1px solid #ece8e1;font-size:13px;line-height:1.65}.answer:last-child{border-bottom:0}.report{font-size:14px;line-height:1.8}.report-item{padding:13px 0;border-bottom:1px solid #ece8e1}.report-item:last-child{border-bottom:0}.report-item strong{display:block;color:#567064;font-size:12px;margin-bottom:4px}.tag{display:inline-block;background:#e9f0ea;color:#39704f;border-radius:99px;padding:4px 9px;font-size:11px;margin:3px 4px 3px 0}
    @media(max-width:900px){.shell{grid-template-columns:1fr}aside{display:none}.top,.content{padding-left:18px;padding-right:18px}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.metrics{grid-template-columns:1fr}.top small{display:none}.intro h2{font-size:30px}.content{padding-top:25px}.panel{overflow-x:auto}table{min-width:700px}}
  </style>
</head>
<body>
  <section id="login-view" class="login">
    <div class="login-card"><div class="mark" style="margin:auto">R</div><h1>管理中心</h1><p>登入連結只會寄到品牌管理信箱<br><strong>rldlab.official@gmail.com</strong></p><button id="login-button" class="login-button">寄送安全登入連結</button><div id="login-message"></div></div>
  </section>
  <section id="admin-view" class="shell hidden">
    <aside><div class="brand"><div class="mark">R</div><div><strong>Reverse Life</strong><small>統一管理中心</small></div></div><nav><button class="active">▦　營運總覽</button><button>▤　分析紀錄</button><button>◉　使用者</button><button>✉　寄信狀態</button><button>◇　Web Apps</button></nav><div class="account">管理員<br><strong>rldlab.official@gmail.com</strong></div></aside>
    <main><header class="top"><div><h1>營運總覽</h1><small>Reverse Life Design</small></div><button id="signout-button" class="signout">登出</button></header>
      <div class="content"><div class="intro"><h2>品牌資料，一處掌握</h2><p>未來新增 Web App 時，以 App ID 分類並匯入同一個後台。</p></div>
        <section class="metrics"><article class="metric"><span>完成分析</span><strong id="metric-total">—</strong></article><article class="metric"><span>本週新增</span><strong id="metric-week">—</strong></article><article class="metric"><span>寄信成功率</span><strong id="metric-sent">—</strong></article><article class="metric"><span>Web Apps</span><strong>1</strong></article></section>
        <section class="panel"><div class="panel-head"><h3>最新分析紀錄</h3><div class="panel-tools"><input id="search" class="search" placeholder="搜尋姓名或 Email"><button class="export primary" id="export-full">匯出完整分析</button><button class="export" id="export-stats">匯出匿名統計</button></div></div><table><thead><tr><th>使用者</th><th>Email</th><th>核心卡點</th><th>完成時間</th><th>寄信</th></tr></thead><tbody id="records"><tr><td colspan="5" class="empty">正在讀取資料…</td></tr></tbody></table></section>
      </div>
    </main>
  </section>
  <dialog id="detail"><div class="detail-head"><div><strong id="detail-title">分析內容</strong><small id="detail-meta"></small></div><button class="close" onclick="detail.close()">×</button></div><div id="detail-body" class="detail-body"></div></dialog>
  <script>
    const ADMIN_EMAIL='rldlab.official@gmail.com'; const QUESTION_TEXTS=[
      '近期有哪些情境讓你感到反覆困擾、難以推進，或不知道該如何選擇？請描述最近一次發生的經過。',
      '在那個情境中，你最明顯的情緒和身體反應是什麼？例如焦慮、疲憊、憤怒、逃避或麻木。',
      '這件事真正影響到你最在意的什麼？例如安全感、自由、認同、成就、關係或生活品質。',
      '面對這個問題時，你通常怎麼處理？這個做法短期保護了你什麼？',
      '如果繼續使用同一種處理方式，未來半年最可能付出什麼代價？',
      '你真正想改變的是目前的情境、別人的行為，還是自己的選擇與反應？為什麼？',
      '這件事當中，哪些是你可以控制、可以影響，以及目前無法控制的？',
      '你過去是否曾成功處理過類似問題？當時有哪些能力、資源或支持幫助了你？',
      '如果這個問題有所改善，你希望三個月後，一個普通的日子會出現哪些具體不同？',
      '針對目前的困擾，你願意先嘗試哪一個幅度最小、可在一週內完成的調整？你最擔心這個調整會帶來什麼影響？'
    ]; let client; let records=[];
    const loginView=document.getElementById('login-view'),adminView=document.getElementById('admin-view'),messageBox=document.getElementById('login-message'),loginButton=document.getElementById('login-button');
    async function init(){try{const config=await fetch('/api/admin-config').then(r=>{if(!r.ok)throw new Error('後台登入設定尚未完成');return r.json()});client=supabase.createClient(config.supabaseUrl,config.supabaseAnonKey);const {data}=await client.auth.getSession();if(data.session)await enter(data.session);client.auth.onAuthStateChange((_e,s)=>s?enter(s):showLogin())}catch(e){showMessage(e.message,'error')}}
    document.getElementById('login-button').onclick=async()=>{loginButton.disabled=true;showMessage('正在寄送…','success');const {error}=await client.auth.signInWithOtp({email:ADMIN_EMAIL,options:{emailRedirectTo:location.origin+'/admin.html',shouldCreateUser:true}});loginButton.disabled=false;if(error){showMessage(error.message,'error');return}showMessage('登入信已寄出，請到品牌 Gmail 點擊安全連結。','success')};
    document.getElementById('signout-button').onclick=()=>client.auth.signOut();
    function showLogin(){loginView.classList.remove('hidden');adminView.classList.add('hidden')}
    function showMessage(text,type){messageBox.className=type;messageBox.textContent=text}
    async function enter(session){if(session.user.email?.toLowerCase()!==ADMIN_EMAIL){await client.auth.signOut();showMessage('這個 Email 沒有管理員權限','error');return}loginView.classList.add('hidden');adminView.classList.remove('hidden');await loadRecords(session.access_token)}
    async function api(path,token){const r=await fetch(path,{headers:{Authorization:'Bearer '+token}});const data=await r.json();if(!r.ok)throw new Error(data.error||'讀取失敗');return data}
    async function loadRecords(token){try{const data=await api('/api/admin-diagnoses',token);records=data.records;document.getElementById('metric-total').textContent=data.metrics.total;document.getElementById('metric-week').textContent=data.metrics.thisWeek;document.getElementById('metric-sent').textContent=data.metrics.sentRate+'%';render(records);document.getElementById('search').oninput=e=>{const q=e.target.value.toLowerCase();render(records.filter(r=>(r.name+' '+r.email).toLowerCase().includes(q)))};document.getElementById('records').onclick=async e=>{const tr=e.target.closest('tr[data-id]');if(!tr)return;const {data:{session}}=await client.auth.getSession();const d=await api('/api/admin-diagnoses?id='+encodeURIComponent(tr.dataset.id),session.access_token);showDetail(d.record)}}catch(e){document.getElementById('records').innerHTML='<tr><td colspan="5" class="empty">'+escapeHtml(e.message)+'</td></tr>'}}
    function render(items){document.getElementById('records').innerHTML=items.length?items.map(r=>'<tr data-id="'+r.id+'"><td>'+escapeHtml(r.name)+'</td><td>'+escapeHtml(r.email)+'</td><td>'+escapeHtml(r.coreTitle)+'</td><td>'+new Date(r.createdAt).toLocaleString('zh-TW')+'</td><td><span class="pill '+(r.emailStatus==='failed'?'failed':'')+'">'+escapeHtml(r.emailStatus)+'</span></td></tr>').join(''):'<tr><td colspan="5" class="empty">尚無分析紀錄</td></tr>'}
    document.getElementById('export-full').onclick=()=>exportFull(); document.getElementById('export-stats').onclick=()=>exportStats();
    function downloadExcel(rows,fileName){const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'資料');XLSX.writeFile(wb,fileName)}
    function exportFull(){if(!records.length)return;const rows=records.map(r=>{const row={姓名:r.name,Email:r.email,生日:r.birthDate||'',App:r.appId,核心卡點:r.coreTitle,寄信狀態:r.emailStatus,完成時間:r.createdAt};(r.answers||[]).forEach((a,i)=>{row['第'+(i+1)+'題回答']=a||''});return row});downloadExcel(rows,'人生反向設計_完整分析.xlsx')}
    function exportStats(){if(!records.length)return;const counts={};records.forEach(r=>{const key=r.coreTitle||'未分類';counts[key]=(counts[key]||0)+1});const rows=Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([核心卡點,筆數])=>({核心卡點,筆數}));rows.push({核心卡點:'總分析筆數',筆數:records.length});rows.push({核心卡點:'寄信成功筆數',筆數:records.filter(r=>r.emailStatus==='sent').length});rows.push({核心卡點:'寄信失敗筆數',筆數:records.filter(r=>r.emailStatus==='failed').length});downloadExcel(rows,'人生反向設計_匿名統計.xlsx')}
    function showDetail(r){
      const report=r.report||{}; const core=report.coreBlock||report.core_block||report.coreIssue||report.core_issue||{};
      document.getElementById('detail-title').textContent=(r.name||'使用者')+' 的分析報告';
      document.getElementById('detail-meta').textContent=[r.email,r.birthDate?'生日：'+r.birthDate:null,r.createdAt?new Date(r.createdAt).toLocaleString('zh-TW'):null].filter(Boolean).join('　•　');
      const answers=Array.isArray(r.answers)?r.answers:[];
      const list=(items)=>Array.isArray(items)&&items.length?'<ul>'+items.map(x=>'<li>'+escapeHtml(x)+'</li>').join('')+'</ul>':'<p class="muted">未提供</p>';
      const experiments=Array.isArray(report.experiments)?report.experiments.map((x,i)=>'<div class="report-item"><strong>實驗 '+(i+1)+'　'+escapeHtml(x.title||'未命名')+(x.deadline?'　<span class="tag">'+escapeHtml(x.deadline)+'</span>':'')+'</strong><p>'+escapeHtml(x.action||'')+'</p><p><b>假設：</b>'+escapeHtml(x.hypothesis||'')+'</p><p><b>觀察證據：</b>'+escapeHtml(x.evidence||'')+'</p><p><b>停止條件：</b>'+escapeHtml(x.stopCondition||'')+'</p></div>').join(''):'<p class="muted">未提供</p>';
      const resources=Array.isArray(report.resources)?report.resources.map(x=>'<div class="report-item"><strong>'+escapeHtml(x.resource||'資源')+'</strong><p>'+escapeHtml(x.application||'')+'</p></div>').join(''):'<p class="muted">未提供</p>';
      const boundaries=Array.isArray(report.boundaries)?report.boundaries.map(x=>'<div class="report-item"><strong>觸發情境：'+escapeHtml(x.trigger||'')+'</strong><p>'+escapeHtml(x.action||'')+'</p><p><b>可使用的表達：</b>'+escapeHtml(x.expression||'')+'</p></div>').join(''):'<p class="muted">未提供</p>';
      document.getElementById('detail-body').innerHTML='<section class="detail-section"><h3>十題回答</h3>'+answers.map((a,i)=>'<div class="answer"><strong>第 '+(i+1)+' 題</strong><p><b>問題：</b>'+escapeHtml(QUESTION_TEXTS[i]||'題目文字未提供')+'</p><p><b>回答：</b>'+escapeHtml(a||'未回答')+'</p></div>').join('')+'</section>'+
      '<section class="detail-section"><h3>核心卡點</h3><p><strong>'+escapeHtml(core.title||r.coreTitle||'已完成分析')+'</strong></p><p>'+escapeHtml(report.summary||'')+'</p><h4>為什麼這是目前最值得處理的卡點</h4><p>'+escapeHtml(core.explanation||'')+'</p><h4>分析依據</h4>'+list(core.evidence)+'</section>'+
      '<section class="detail-section"><h3>目前的應對模式</h3><p><b>目前反應：</b>'+escapeHtml(report.copingPattern?.currentResponse||'')+'</p><p><b>保護功能：</b>'+escapeHtml(report.copingPattern?.protectiveFunction||'')+'</p><p><b>長期代價：</b>'+escapeHtml(report.copingPattern?.longTermCost||'')+'</p></section>'+
      '<section class="detail-section"><h3>可控範圍</h3><h4>我可以直接控制</h4>'+list(report.controllability?.controllable)+'<h4>我可以影響</h4>'+list(report.controllability?.influenceable)+'<h4>我無法控制</h4>'+list(report.controllability?.uncontrollable)+'</section>'+
      '<section class="detail-section"><h3>可運用資源</h3>'+resources+'</section><section class="detail-section"><h3>界線與選擇</h3>'+boundaries+'</section><section class="detail-section"><h3>專屬低成本實驗</h3>'+experiments+'</section>'+
      '<section class="detail-section"><h3>結語</h3><p>'+escapeHtml(report.closingReminder||'')+'</p></section>';
      document.getElementById('detail').showModal()
    }
    function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
    init();
  </script>
</body>
</html>
