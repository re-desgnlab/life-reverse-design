<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <meta name="referrer" content="no-referrer">
    <title>人生反向設計所｜私人分析報告</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>body { font-family: 'Noto Sans TC', sans-serif; }</style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <header class="w-full border-b border-slate-800 bg-slate-900/70">
        <div class="max-w-2xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="font-black text-lg bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">🧭 人生反向設計所</div>
            <div class="text-xs text-slate-400 border border-slate-800 px-3 py-1 rounded-full">私人分析報告</div>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-6 py-8">
        <div id="loading" class="text-center space-y-4 py-20">
            <div class="inline-block w-12 h-12 rounded-full border-4 border-slate-800 border-t-amber-500 animate-spin"></div>
            <p class="text-sm text-slate-400">正在安全讀取你的報告…</p>
        </div>

        <div id="error" class="hidden bg-slate-900 border border-rose-900/50 rounded-2xl p-6 text-center space-y-3">
            <h1 class="text-lg font-bold text-white">目前無法開啟這份報告</h1>
            <p id="error-message" class="text-sm text-slate-400"></p>
        </div>

        <div id="report" class="hidden space-y-6">
            <div class="flex items-center justify-between gap-4">
                <span class="text-xs font-bold text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-3 py-1 rounded-full">✓ 私人完整報告</span>
                <span id="expiry" class="text-xs text-slate-500"></span>
            </div>

            <section class="bg-gradient-to-br from-amber-500/10 to-slate-900 border border-amber-500/30 rounded-3xl p-6 space-y-3">
                <div class="text-xs font-bold text-amber-400">你的核心卡點</div>
                <h1 id="core-title" class="text-2xl font-black text-white leading-relaxed"></h1>
                <p id="summary" class="text-sm text-slate-300 leading-relaxed"></p>
            </section>

            <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
                <h2 class="text-sm font-bold text-amber-400">🎯 核心卡點深度解構</h2>
                <p id="core-explanation" class="text-sm text-slate-200 leading-relaxed"></p>
                <div class="text-xs font-bold text-slate-500 pt-2">判斷依據</div>
                <ul id="core-evidence" class="space-y-2 text-xs text-slate-300"></ul>
            </section>

            <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
                <h2 class="text-sm font-bold text-violet-400">🧩 目前的因應模式</h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs leading-relaxed">
                    <div class="bg-slate-950/50 border border-slate-800 rounded-xl p-3"><strong class="block text-slate-500 mb-1">目前做法</strong><span id="current-response"></span></div>
                    <div class="bg-emerald-950/20 border border-emerald-900/40 rounded-xl p-3"><strong class="block text-emerald-400 mb-1">短期保護</strong><span id="protective-function"></span></div>
                    <div class="bg-rose-950/20 border border-rose-900/40 rounded-xl p-3"><strong class="block text-rose-400 mb-1">長期代價</strong><span id="long-term-cost"></span></div>
                </div>
            </section>

            <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
                <h2 class="text-sm font-bold text-cyan-400">🧭 目前可以把力氣放在哪裡</h2>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 text-xs">
                    <div class="bg-slate-950/50 border border-slate-800 rounded-xl p-3"><strong class="block text-emerald-400 mb-2">可以控制</strong><ul id="controllable" class="space-y-1"></ul></div>
                    <div class="bg-slate-950/50 border border-slate-800 rounded-xl p-3"><strong class="block text-amber-400 mb-2">可以影響</strong><ul id="influenceable" class="space-y-1"></ul></div>
                    <div class="bg-slate-950/50 border border-slate-800 rounded-xl p-3"><strong class="block text-slate-400 mb-2">目前無法控制</strong><ul id="uncontrollable" class="space-y-1"></ul></div>
                </div>
            </section>

            <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
                <h2 class="text-sm font-bold text-blue-400">🛠 現有可調動資源</h2>
                <div id="resources" class="grid grid-cols-1 sm:grid-cols-2 gap-3"></div>
            </section>

            <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
                <h2 class="text-sm font-bold text-rose-400">⚠️ 需要保護的界線</h2>
                <div id="boundaries" class="space-y-3"></div>
            </section>

            <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
                <h2 class="text-sm font-bold text-amber-400">🧪 3個低成本實驗</h2>
                <div id="experiments" class="space-y-3"></div>
            </section>

            <p id="closing-reminder" class="text-xs text-slate-400 text-center leading-relaxed px-4"></p>
        </div>
    </main>

    <script>
        loadReport();

        async function loadReport() {
            const token = new URLSearchParams(window.location.search).get('token');
            if (!token) return showError('報告連結缺少必要資訊。');
            try {
                const response = await fetch(`/api/report?token=${encodeURIComponent(token)}`);
                const data = await response.json();
                if (!response.ok) throw new Error(data.error || '無法讀取報告。');
                renderReport(data.report, data.expiresAt);
            } catch (error) {
                showError(error.message);
            }
        }

        function renderReport(data, expiresAt) {
            document.getElementById('core-title').textContent = data.coreBlock.title;
            document.getElementById('summary').textContent = data.summary;
            document.getElementById('core-explanation').textContent = data.coreBlock.explanation;
            renderList('core-evidence', data.coreBlock.evidence);
            document.getElementById('current-response').textContent = data.copingPattern.currentResponse;
            document.getElementById('protective-function').textContent = data.copingPattern.protectiveFunction;
            document.getElementById('long-term-cost').textContent = data.copingPattern.longTermCost;
            renderList('controllable', data.controllability.controllable);
            renderList('influenceable', data.controllability.influenceable);
            renderList('uncontrollable', data.controllability.uncontrollable);
            renderResources(data.resources);
            renderBoundaries(data.boundaries);
            renderExperiments(data.experiments);
            document.getElementById('closing-reminder').textContent = data.closingReminder;
            document.getElementById('expiry').textContent = `保存至 ${new Date(expiresAt).toLocaleDateString('zh-TW')}`;
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('report').classList.remove('hidden');
        }

        function renderList(id, items) {
            const container = document.getElementById(id);
            container.replaceChildren();
            items.forEach((value) => {
                const item = document.createElement('li');
                item.className = 'flex gap-2 leading-relaxed';
                const dot = document.createElement('span');
                dot.className = 'text-slate-500';
                dot.textContent = '•';
                const text = document.createElement('span');
                text.textContent = value;
                item.append(dot, text);
                container.appendChild(item);
            });
        }

        function renderResources(items) {
            const container = document.getElementById('resources');
            items.forEach((item) => {
                const card = createCard();
                addRow(card, item.resource, item.application, 'text-blue-300');
                container.appendChild(card);
            });
        }

        function renderBoundaries(items) {
            const container = document.getElementById('boundaries');
            items.forEach((item) => {
                const card = createCard();
                addRow(card, '啟動條件', item.trigger, 'text-rose-300');
                addRow(card, '保護動作', item.action, 'text-slate-200');
                if (item.expression) addRow(card, '可以這樣說', `「${item.expression}」`, 'text-slate-300');
                container.appendChild(card);
            });
        }

        function renderExperiments(items) {
            const container = document.getElementById('experiments');
            items.forEach((item) => {
                const card = createCard();
                const title = document.createElement('div');
                title.className = 'font-bold text-amber-400 text-sm';
                title.textContent = `🧪 ${item.title}・${item.deadline}`;
                card.appendChild(title);
                addRow(card, '怎麼做', item.action, 'text-slate-200');
                addRow(card, '要驗證什麼', item.hypothesis, 'text-slate-300');
                addRow(card, '觀察證據', item.evidence, 'text-slate-300');
                addRow(card, '停止條件', item.stopCondition, 'text-slate-400');
                container.appendChild(card);
            });
        }

        function createCard() {
            const card = document.createElement('div');
            card.className = 'bg-slate-950/50 border border-slate-800 rounded-xl p-4 space-y-2 text-xs leading-relaxed';
            return card;
        }

        function addRow(container, labelText, value, valueClass) {
            const row = document.createElement('div');
            const label = document.createElement('strong');
            label.className = 'text-slate-500 mr-2';
            label.textContent = `${labelText}：`;
            const text = document.createElement('span');
            text.className = valueClass;
            text.textContent = value;
            row.append(label, text);
            container.appendChild(row);
        }

        function showError(message) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('error-message').textContent = message;
            document.getElementById('error').classList.remove('hidden');
        }
    </script>
</body>
</html>
